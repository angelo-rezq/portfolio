<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Project - Angelo</title>
<meta name="description" content="Project case studies by Eng. Angluos Rezq, Software Engineer."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@400;600;700;800&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Source+Code+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/_next/static/css/a9ef85c834ca1840.css"/>
<style>
html{background:#0a0a0f}
.pj-hero-img{width:100%;max-height:46vh;object-fit:cover;border-radius:1.5rem;border:1px solid rgba(255,255,255,.08)}
.pj-chip{display:inline-flex;align-items:center;border-radius:9999px;background:hsl(var(--primary)/.1);color:hsl(var(--primary));padding:.3rem .8rem;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pj-pill{padding:.35rem .8rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9999px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--muted-foreground))}
.pj-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.6rem;border-radius:1rem;font-weight:700;transition:all .2s}
.pj-btn-primary{background:hsl(var(--primary));color:#fff}
.pj-btn-primary:hover{filter:brightness(1.1)}
.pj-btn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:hsl(var(--foreground))}
.pj-btn-ghost:hover{background:rgba(255,255,255,.1)}
.pj-shot{border-radius:1rem;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.pj-shot img{width:100%;height:auto;display:block}
.pj-shot figcaption{padding:.6rem .9rem;font-size:.78rem;color:hsl(var(--muted-foreground))}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:1rem}
html,body{background:#171a1c!important;color:#fff!important;font-family:Inter,system-ui,sans-serif}.pj-hero-img{object-fit:contain;background:#1d2226;max-height:65vh}.case-section{border:1px solid #30383e;border-radius:16px;background:#1d2226;padding:24px;margin-top:24px}.case-section h2{font-family:Sora;font-size:20px;font-weight:700;margin:0 0 12px}.case-section p,.case-section li{color:#acb4b9;line-height:1.8}.case-section ul{padding-left:20px;list-style:disc}.pj-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.pj-list a{border:1px solid #30383e;border-radius:14px;padding:16px;background:#1d2226}.pj-list img{width:100%;height:200px;object-fit:cover;border-radius:9px;margin-bottom:12px}@media(max-width:600px){.pj-list{grid-template-columns:1fr}.case-section{padding:20px}.pj-hero-img{border-radius:14px}}</style>
</head>
<body class="font-body antialiased bg-background text-foreground min-h-screen">
<div class="container mx-auto px-4 sm:px-6 py-8 max-w-4xl">
<a href="/#projects" style="display:inline-flex;align-items:center;gap:.4rem;color:hsl(var(--muted-foreground));font-size:.85rem;margin-bottom:1.5rem">&larr; All projects</a>
<div id="app"><p style="color:hsl(var(--muted-foreground))">Loading&hellip;</p></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
fetch('/api/bootstrap').then(function(r){return r.json()}).then(function(d){
  var data = d.data || d;
  var id = new URLSearchParams(location.search).get('id');
  var list = data.projects || [];
  var p = list.filter(function(x){return String(x.id)===id})[0] || list.filter(function(x){return x.name===id})[0];
  var app = document.getElementById('app');
  if(!id){app.innerHTML='<h1 style="font:700 32px Sora;margin-bottom:24px">Project Library</h1><div class="pj-list">'+list.map(function(x){return '<a href="/project.html?id='+encodeURIComponent(x.id)+'">'+(x.image?'<img src="'+esc(x.image)+'" alt="'+esc(x.name)+'">':'')+'<h2>'+esc(x.name)+'</h2><p style="color:#acb4b9;font-size:13px">'+esc(x.tagline)+'</p></a>'}).join('')+'</div>';return;}
  if(!p){ app.innerHTML = '<p style="color:hsl(var(--muted-foreground))">Project not found. <a href="/#projects" style="color:hsl(var(--primary))">Back to projects</a></p>'; return; }
  document.title = p.name + ' - Angelo';
  var h = '';
  if(p.image) h += '<img class="pj-hero-img" src="'+esc(p.image)+'" alt="'+esc(p.name)+'"/>';
  h += '<div style="margin-top:1.5rem;display:flex;flex-wrap:wrap;align-items:center;gap:.7rem">';
  h += '<h1 class="font-headline" style="font-size:clamp(1.6rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em">'+esc(p.name)+'</h1>';
  if(p.category) h += '<span class="pj-chip">'+esc(p.category)+'</span>';
  if(p.status) h += '<span class="pj-chip" style="background:rgba(255,255,255,.06);color:hsl(var(--muted-foreground))">'+esc(p.status)+'</span>';
  h += '</div>';
  if(p.tagline) h += '<p data-project-tagline class="text-gradient font-headline" style="font-weight:700;font-size:1.05rem;margin-top:.4rem">'+esc(p.tagline)+'</p>';
  if(p.descriptionEn||p.description) h += '<p data-project-description style="color:hsl(var(--muted-foreground));margin-top:1rem;line-height:1.7;max-width:46rem">'+esc(p.descriptionEn)+'</p>';

  if(p.caseStudy){var cs=p.caseStudy;
    if(cs.problem){
      [['Problem',cs.problem],['Solution',cs.solution],['Outcome',cs.outcome]].forEach(function(row){if(row[1])h+='<section class="case-section"><h2>'+row[0]+'</h2><p>'+esc(row[1])+'</p></section>';});
    }else{
      h+='<section class="case-section"><h2>Project Overview</h2><p data-case-context>'+esc(cs.context||p.descriptionEn||'')+'</p></section>';
      if(cs.features&&cs.features.length)h+='<section class="case-section"><h2>Main Workflows</h2><ul data-case-features>'+cs.features.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></section>';
      if(cs.scope)h+='<section class="case-section"><h2>Scope &amp; Evidence</h2><p>'+esc(cs.scope)+'</p></section>';
    }
  }
  var tech = Array.isArray(p.tech) ? p.tech : String(p.tech||'').split(',');
  tech = tech.map(function(t){return String(t).trim()}).filter(Boolean);
  if(tech.length){ h += '<h2 style="font:700 20px Sora;margin-top:28px">Stack</h2><div style="display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.2rem">'; tech.forEach(function(t){ h += '<span class="pj-pill">'+esc(t)+'</span>'; }); h += '</div>'; }
  var links = '';
  if(p.demo && !p.demo.includes('example.com')) links += '<a class="pj-btn pj-btn-primary" href="'+esc(p.demo)+'" target="_blank" rel="noopener noreferrer">Live Demo</a>';
  if(p.github && !p.github.includes('github.com/oaama')) links += '<a class="pj-btn pj-btn-ghost" href="'+esc(p.github)+'" target="_blank" rel="noopener noreferrer">GitHub</a>';
  if(p.drive) links += '<a class="pj-btn pj-btn-ghost" href="'+esc(p.drive)+'" target="_blank" rel="noopener noreferrer">Drive</a>';
  if(links) h += '<div style="display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem">'+links+'</div>';
  var shots = Array.isArray(p.screenshots) ? p.screenshots : [];
  if(shots.length){
    h += '<h2 class="font-headline" style="font-size:1.2rem;font-weight:700;margin:2.2rem 0 .9rem">Screenshots</h2><div class="pj-grid">';
    shots.forEach(function(s){ if(!s||!s.image) return; h += '<figure class="pj-shot"><img src="'+esc(s.image)+'" alt="'+esc(s.caption||p.name)+'" loading="lazy" decoding="async"/>'+(s.caption?'<figcaption>'+esc(s.caption)+'</figcaption>':'')+'</figure>'; });
    h += '</div>';
  }
  app.innerHTML = h;
}).catch(function(e){
  document.getElementById('app').innerHTML = '<p style="color:hsl(var(--muted-foreground))">Could not load this project right now.</p>';
});
</script>
<script src="/language.js" defer></script>
</body>
</html>
