name = "angluos"
main = "worker.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# Google Search Console verification token (section 5 of the SEO spec).
# Uncomment and paste the real token from Search Console, or set
# GOOGLE_SITE_VERIFICATION in the Cloudflare dashboard (Worker -> Settings
# -> Variables and Secrets). The worker injects the verification meta tag
# into HTML pages only while this variable is set. Never commit a fake code.
# [vars]
# GOOGLE_SITE_VERIFICATION = "paste-real-token-here"
